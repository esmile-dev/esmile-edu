# Development Profile with PostgreSQL + Test Data
spring.application.name=esmile-edu

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/esmile_edu
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway Configuration - Dev includes test data migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration/dev
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# H2 Console
spring.h2.console.enabled=false

# Server Configuration
server.port=10328

# JWT Configuration
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:resources/keys/private.pem}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:resources/keys/public.pem}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Redeem API Key Configuration
redeem.api-key=${REDEEM_API_KEY:esmile-edu-external-api-key-secret}

# Email Provider Configuration
email.provider=${EMAIL_PROVIDER:mock}

# Video Storage Provider Configuration
video.provider=tencent

# Tencent VOD Configuration
tencent.vod.secret-id=${TENCENT_VOD_SECRET_ID}
tencent.vod.secret-key=${TENCENT_VOD_SECRET_KEY}
tencent.vod.app-id=${TENCENT_VOD_APP_ID:1408936978}

# Video playback
tencent.vod.signature-expire=7200
