spring.application.name=esmile-edu

# PostgreSQL Configuration (Production)
spring.datasource.url=jdbc:postgresql://localhost:5432/esmile_edu
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# H2 Console (Dev only - enable via profile)
spring.h2.console.enabled=false

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:esmile-edu-secret-key-for-jwt-token-generation-minimum-32-chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Redeem API Key Configuration
redeem.api-key=${REDEEM_API_KEY:esmile-edu-external-api-key-secret}
