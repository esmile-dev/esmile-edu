spring.application.name=esmile-edu

# PostgreSQL Configuration (Production)
spring.datasource.url=jdbc:postgresql://localhost:5432/esmile_edu
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# H2 Console (Dev only - enable via profile)
spring.h2.console.enabled=false

# Server Configuration
server.port=10328

# JWT Configuration (RSA key paths - auto-generated on first startup if not exists)
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:resources/keys/private.pem}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:resources/keys/public.pem}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Redeem API Key Configuration
redeem.api-key=${REDEEM_API_KEY:esmile-edu-external-api-key-secret}

# Email Provider Configuration (mock, tencent, sendgrid, aws)
#email.provider=${EMAIL_PROVIDER:mock}

# Video Storage Provider Configuration (mock, tencent)
video.provider=${VIDEO_PROVIDER:mock}

# Tencent VOD Configuration (when video.provider=tencent)
# IMPORTANT: Replace with real credentials via environment variables in production
tencent.vod.secret-id=${TENCENT_VOD_SECRET_ID:}
tencent.vod.secret-key=${TENCENT_VOD_SECRET_KEY:}
tencent.vod.app-id=${TENCENT_VOD_APP_ID:}

# Video playback
# Key anti-hotlinking signature expiration in seconds (default: 2 hours)
tencent.vod.signature-expire=7200
