# Development Profile - H2 In-Memory Database
spring.application.name=esmile-edu

# H2 Configuration
spring.datasource.url=jdbc:h2:mem:esmiledb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway Configuration - Disabled in dev (use JPA ddl-auto)
spring.flyway.enabled=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Configuration
server.port=10328

# JWT Configuration (RSA key paths - auto-generated on first startup if not exists)
jwt.private-key-path=${user.dir}/resources/keys/private.pem
jwt.public-key-path=${user.dir}/resources/keys/public.pem
jwt.expiration=86400000

# Redeem API Key Configuration
redeem.api-key=esmile-edu-external-api-api-key-secret

# Email Provider Configuration
email.provider=mock

# Video Storage Provider Configuration
video.provider=mock
