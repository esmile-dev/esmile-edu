# Test Profile - H2 In-Memory Database
spring.application.name=esmile-edu

# H2 Configuration
spring.datasource.url=jdbc:h2:mem:esmiledb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Configuration - Disabled for tests
spring.flyway.enabled=false

# H2 Console - Disabled for tests
spring.h2.console.enabled=false

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=test-secret-key-for-jwt-token-generation-minimum-32-chars
jwt.expiration=86400000

# Redeem API Key Configuration
redeem.api-key=test-api-key
